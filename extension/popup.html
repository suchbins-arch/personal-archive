<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Archivault</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #080B0F;
    color: #E8F0F8;
    font-size: 13px;
  }
  #header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid #1E2A35;
  }
  #header .logo { font-size: 16px; font-weight: 700; color: #00D4FF; letter-spacing: -0.5px; }
  #header .sub { font-size: 11px; color: #3D5870; margin-left: auto; }

  #page-info {
    padding: 12px 14px 8px;
    border-bottom: 1px solid #1E2A35;
  }
  #page-title {
    font-size: 13px;
    font-weight: 600;
    color: #E8F0F8;
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #page-url {
    font-size: 11px;
    color: #3D5870;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .type-web   { background: rgba(0,212,255,0.1); color:#00D4FF; border:1px solid rgba(0,212,255,0.25); }
  .type-youtube { background: rgba(255,68,68,0.1); color:#FF4444; border:1px solid rgba(255,68,68,0.25); }
  .type-pdf   { background: rgba(245,200,66,0.1); color:#F5C842; border:1px solid rgba(245,200,66,0.25); }

  #form { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }

  label { font-size: 11px; color: #7A9BB5; margin-bottom: 2px; display: block; }

  #tags-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 6px 8px;
    background: #0A0F14;
    border: 1px solid #1E2A35;
    border-radius: 6px;
    min-height: 34px;
    cursor: text;
  }
  .tag-chip {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.25);
    border-radius: 4px;
    color: #00D4FF;
    font-size: 11px;
  }
  .tag-chip .rm {
    cursor: pointer;
    opacity: 0.6;
    font-size: 12px;
    line-height: 1;
    padding: 0 1px;
  }
  .tag-chip .rm:hover { opacity: 1; }
  #tag-input {
    flex: 1;
    min-width: 80px;
    background: transparent;
    border: none;
    outline: none;
    color: #E8F0F8;
    font-size: 12px;
    font-family: inherit;
  }

  .tag-suggest {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: -2px;
  }
  .tag-suggest button {
    padding: 2px 8px;
    background: #0E1318;
    border: 1px solid #1E2A35;
    border-radius: 4px;
    color: #7A9BB5;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .tag-suggest button:hover {
    border-color: #00D4FF;
    color: #00D4FF;
  }

  textarea {
    width: 100%;
    background: #0A0F14;
    border: 1px solid #1E2A35;
    border-radius: 6px;
    color: #E8F0F8;
    font-size: 12px;
    font-family: inherit;
    padding: 7px 9px;
    resize: vertical;
    min-height: 54px;
    outline: none;
  }
  textarea:focus { border-color: rgba(0,212,255,0.4); }
  textarea::placeholder { color: #3D5870; }

  #save-btn {
    width: 100%;
    padding: 9px;
    background: #00D4FF;
    border: none;
    border-radius: 7px;
    color: #080B0F;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  #save-btn:hover { opacity: 0.85; }
  #save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #toast {
    display: none;
    padding: 7px 14px;
    background: rgba(0,212,255,0.12);
    border-top: 1px solid rgba(0,212,255,0.25);
    color: #00D4FF;
    font-size: 12px;
    text-align: center;
  }

  #footer {
    display: flex;
    gap: 8px;
    padding: 8px 14px 12px;
    border-top: 1px solid #1E2A35;
  }
  #footer button {
    flex: 1;
    padding: 6px;
    background: #0E1318;
    border: 1px solid #1E2A35;
    border-radius: 6px;
    color: #7A9BB5;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  #footer button:hover { border-color: #2A3A4A; color: #E8F0F8; }

  #count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 17px;
    height: 17px;
    background: #00D4FF;
    border-radius: 50%;
    color: #080B0F;
    font-size: 10px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div id="header">
  <span class="logo">⬡ Archivault</span>
  <span class="sub">수집기</span>
  <span id="count-badge">0</span>
</div>

<div id="page-info">
  <div id="type-badge" class="type-badge type-web">🌐 웹</div>
  <div id="page-title">페이지 정보 로딩 중…</div>
  <div id="page-url"></div>
</div>

<div id="form">
  <div>
    <label>태그</label>
    <div id="tags-wrap">
      <input id="tag-input" placeholder="태그 입력 후 Enter…" />
    </div>
    <div class="tag-suggest" id="tag-suggest"></div>
  </div>
  <div>
    <label>메모</label>
    <textarea id="memo" placeholder="이 페이지를 저장하는 이유, 핵심 포인트…"></textarea>
  </div>
  <button id="save-btn">저장</button>
</div>

<div id="toast">✓ 저장 완료!</div>

<div id="footer">
  <button id="open-btn">🗂 아카이브 열기</button>
  <button id="export-btn">📤 JSON 내보내기</button>
</div>

<script src="popup.js"></script>
</body>
</html>
